<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Architecture POC Admin - Factory Writer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1e8;
        --panel: rgba(255, 255, 255, 0.88);
        --text: #172033;
        --muted: #64748b;
        --border: rgba(23, 32, 51, 0.14);
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 10%, rgba(15, 118, 110, 0.14), transparent 32rem),
          radial-gradient(circle at 85% 15%, rgba(194, 65, 12, 0.12), transparent 28rem),
          var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .toolbar {
        position: fixed;
        z-index: 2;
        top: 18px;
        left: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        box-shadow: 0 18px 45px rgba(23, 32, 51, 0.12);
        backdrop-filter: blur(12px);
      }

      .title {
        margin: 0 12px 0 2px;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
      }

      button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        font-size: 17px;
        font-weight: 700;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .zoom-label {
        min-width: 54px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .canvas {
        width: 100vw;
        height: 100vh;
        overflow: auto;
        padding: 96px 48px 48px;
      }

      .diagram {
        transform-origin: top left;
        transition: transform 120ms ease;
      }

      .diagram img {
        display: block;
        max-width: none;
        width: 1800px;
        height: auto;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 22px 60px rgba(23, 32, 51, 0.16);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <p class="title">Architecture POC Admin</p>
      <button type="button" aria-label="Dézoomer" id="zoom-out">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button type="button" aria-label="Zoomer" id="zoom-in">+</button>
      <button type="button" aria-label="Réinitialiser" id="zoom-reset">⟲</button>
    </div>

    <main class="canvas">
      <div class="diagram" id="diagram">
        <img
          src="./admin-poc-architecture.svg?v=signals-on-edges-v1"
          alt="Architecture POC Admin Factory Writer"
        />
      </div>
    </main>

    <script>
      const diagram = document.querySelector("#diagram");
      const label = document.querySelector("#zoom-label");
      let zoom = 1;

      const render = () => {
        diagram.style.transform = `scale(${zoom})`;
        label.textContent = `${Math.round(zoom * 100)}%`;
      };

      document.querySelector("#zoom-in").addEventListener("click", () => {
        zoom = Math.min(zoom + 0.15, 3);
        render();
      });

      document.querySelector("#zoom-out").addEventListener("click", () => {
        zoom = Math.max(zoom - 0.15, 0.4);
        render();
      });

      document.querySelector("#zoom-reset").addEventListener("click", () => {
        zoom = 1;
        render();
      });
    </script>
  </body>
</html>
