<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">ERD POC Style Guide DB Design</title>
  <desc id="desc">Diagramme entite-relation du design POC pour l'ingestion du style guide Axolotl.</desc>
  <defs>
    <style>
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #4b5563; }
      .table-title { font: 700 18px Inter, Arial, sans-serif; fill: #111827; }
      .field { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2937; }
      .edge { stroke: #6b7280; stroke-width: 2.4; fill: none; }
      .edge-label { font: 600 13px Inter, Arial, sans-serif; fill: #374151; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .header { fill: #eef2ff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .divider { stroke: #e5e7eb; stroke-width: 1.5; }
      .badge { fill: #f8fafc; stroke: #d1d5db; stroke-width: 1; rx: 8; }
      .badge-text { font: 600 11px Inter, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <text x="60" y="56" class="title">POC Style Guide DB Design - ERD</text>
  <text x="60" y="84" class="subtitle">Version statique pour impression PDF</text>

  <path d="M390 220 L540 220 L540 200 L650 200" class="edge"/>
  <text x="475" y="208" class="edge-label">genere</text>

  <path d="M220 280 L220 430 L280 430" class="edge"/>
  <text x="88" y="364" class="edge-label">est decoupe en</text>

  <path d="M900 280 L900 420 L835 420" class="edge"/>
  <text x="922" y="364" class="edge-label">contient</text>

  <path d="M520 630 L520 770 L650 770" class="edge"/>
  <text x="402" y="712" class="edge-label">justifie</text>

  <path d="M1310 280 L1310 770 L1180 770" class="edge"/>
  <text x="1330" y="536" class="edge-label">cible</text>

  <g transform="translate(60 120)">
    <rect width="330" height="160" class="card"/>
    <rect width="330" height="46" class="header"/>
    <text x="20" y="30" class="table-title">source_guide_style</text>
    <line x1="0" y1="46" x2="330" y2="46" class="divider"/>
    <text x="20" y="74" class="field">uuid id PK</text>
    <text x="20" y="98" class="field">varchar uri_fichier</text>
    <text x="20" y="122" class="field">enum_statut_source statut</text>
    <text x="20" y="146" class="field">timestamptz uploade_le</text>
  </g>

  <g transform="translate(280 430)">
    <rect width="360" height="190" class="card"/>
    <rect width="360" height="46" class="header"/>
    <text x="20" y="30" class="table-title">fragment_style</text>
    <line x1="0" y1="46" x2="360" y2="46" class="divider"/>
    <text x="20" y="74" class="field">uuid id PK</text>
    <text x="20" y="98" class="field">uuid source_id FK</text>
    <text x="20" y="122" class="field">integer index_fragment</text>
    <text x="20" y="146" class="field">varchar titre_section</text>
    <text x="20" y="170" class="field">text contenu</text>
  </g>

  <g transform="translate(650 120)">
    <rect width="500" height="160" class="card"/>
    <rect width="500" height="46" class="header"/>
    <text x="20" y="30" class="table-title">pack_style</text>
    <line x1="0" y1="46" x2="500" y2="46" class="divider"/>
    <text x="20" y="74" class="field">uuid id PK</text>
    <text x="20" y="98" class="field">uuid source_id FK</text>
    <text x="20" y="122" class="field">varchar label_version</text>
    <text x="20" y="146" class="field">enum_statut_pack statut / boolean est_actif / timestamptz cree_le / timestamptz approuve_le</text>
  </g>

  <g transform="translate(1160 120)">
    <rect width="380" height="190" class="card"/>
    <rect width="380" height="46" class="header"/>
    <text x="20" y="30" class="table-title">taxonomie_produit</text>
    <line x1="0" y1="46" x2="380" y2="46" class="divider"/>
    <text x="20" y="74" class="field">uuid id PK</text>
    <text x="20" y="98" class="field">varchar code_famille</text>
    <text x="20" y="122" class="field">varchar libelle_fr</text>
    <text x="20" y="146" class="field">uuid parent_id FK</text>
  </g>

  <g transform="translate(650 660)">
    <rect width="530" height="260" class="card"/>
    <rect width="530" height="46" class="header"/>
    <text x="20" y="30" class="table-title">regle_style</text>
    <line x1="0" y1="46" x2="530" y2="46" class="divider"/>
    <text x="20" y="74" class="field">uuid id PK</text>
    <text x="20" y="98" class="field">uuid pack_id FK</text>
    <text x="20" y="122" class="field">uuid fragment_source_id FK</text>
    <text x="20" y="146" class="field">uuid taxonomie_produit_id FK</text>
    <text x="20" y="170" class="field">enum_type_regle type_regle</text>
    <text x="20" y="194" class="field">enum_niveau_contrainte niveau_contrainte</text>
    <text x="20" y="218" class="field">text texte_regle</text>
    <text x="20" y="242" class="field">boolean est_actif</text>
  </g>

  <g transform="translate(1180 690)">
    <rect width="260" height="96" class="badge"/>
    <text x="16" y="30" class="badge-text">Regle globale</text>
    <text x="16" y="54" class="field">taxonomie_produit_id = NULL</text>
    <text x="16" y="78" class="field">type_regle = VOIX</text>
  </g>

  <g transform="translate(1180 806)">
    <rect width="300" height="96" class="badge"/>
    <text x="16" y="30" class="badge-text">Regle contextuelle</text>
    <text x="16" y="54" class="field">taxonomie_produit_id != NULL</text>
    <text x="16" y="78" class="field">type_regle = TON</text>
  </g>
</svg>
