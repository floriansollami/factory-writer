name: Deploy Cloud Run API + Temporal Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-writer-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: factory-writer-poc-1776097019
  REGION: europe-west1
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: factory-writer
  FRONTEND_IMAGE_NAME: factory-writer-frontend
  CLOUDSQL_INSTANCE: factory-writer-poc-1776097019:europe-west1:factory-writer-db
  TEMPORAL_ADDRESS: factory-writer-poc.waxwe.tmprl.cloud:7233
  TEMPORAL_NAMESPACE: factory-writer-poc.waxwe
  TEMPORAL_DEPLOYMENT_NAME: factory-writer
  GCP_LOCATION: global
  GCP_DOCUMENT_AI_LOCATION: eu
  GCP_DOCUMENT_AI_PROCESSOR_ID: 684ca2ae2323b47c
  GCP_DOCUMENT_AI_PROCESSOR_VERSION: pretrained-layout-parser-v1.5-2025-08-25
  GCP_STYLE_GUIDE_BUCKET_NAME: factory-writer-poc-1776097019-brand-styles
  LLM_STYLE_GUIDE_TIMEOUT_SECONDS: "90"
  RUNTIME_SERVICE_ACCOUNT: factory-writer-runtime@factory-writer-poc-1776097019.iam.gserviceaccount.com

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check src/factory_writer alembic tests

      - name: Check backend formatting
        working-directory: backend
        run: uv run ruff format --check src/factory_writer alembic tests

      - name: Type-check backend
        working-directory: backend
        run: uv run mypy --explicit-package-bases src/factory_writer alembic tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest

      - name: Compile backend sources
        working-directory: backend
        run: uv run python -m compileall -q src/factory_writer alembic tests

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend end-to-end
        working-directory: frontend
        run: npm run test:e2e

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Compute image metadata
        id: meta
        run: |
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if ! gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${ARTIFACT_REPOSITORY}" \
              --project="${PROJECT_ID}" \
              --repository-format=docker \
              --location="${REGION}"
          fi
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            ./backend
          docker push "${{ steps.meta.outputs.image }}"

  migrate-db:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy and execute DB migration job
        run: |
          gcloud run jobs deploy factory-writer-db-migrate \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --task-timeout=600s \
            --max-retries=1 \
            --tasks=1 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=alembic \
            --args=-c,alembic.ini,upgrade,head \
            --execute-now \
            --wait

      - name: Deploy and execute taxonomy seed job
        run: |
          gcloud run jobs deploy factory-writer-db-seed \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --task-timeout=300s \
            --max-retries=1 \
            --tasks=1 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=python \
            --args=-m,factory_writer.scripts.seed_taxonomie \
            --execute-now \
            --wait

  deploy-api:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-db]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy factory-writer-api \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --allow-unauthenticated \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=uvicorn \
            --args=factory_writer.main:app,--host,0.0.0.0,--port,8080

      - name: Remove legacy Eventarc trigger
        run: |
          if gcloud eventarc triggers describe factory-writer-style-guide-finalized \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>&1; then
            gcloud eventarc triggers delete factory-writer-style-guide-finalized \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --quiet
          fi

  build-and-push-frontend:
    runs-on: ubuntu-latest
    needs: [quality, deploy-api]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Compute frontend image metadata
        id: meta
        run: |
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Build and push frontend Docker image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          API_URL="$(gcloud run services describe factory-writer-api \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          docker build \
            --build-arg "VITE_API_BASE_URL=${API_URL}" \
            --build-arg "VITE_USE_MSW=false" \
            -t "${{ steps.meta.outputs.image }}" \
            ./frontend
          docker push "${{ steps.meta.outputs.image }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push-frontend
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy factory-writer-frontend \
            --image="${{ needs.build-and-push-frontend.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=256Mi \
            --max-instances=3

  deploy-workers:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-db]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy worker pool
        run: |
          gcloud beta run worker-pools deploy factory-writer-style-guide-ingestion --quiet \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --instances=1 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},TEMPORAL__WORKER_ROLE=style-guide-ingestion,LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=python \
            --args=-m,factory_writer.temporal.worker

      - name: Remove unused worker pools for the POC
        run: |
          for worker_pool in \
            factory-writer-style-admin \
            factory-writer-sku-lifecycle
          do
            if gcloud beta run worker-pools describe "${worker_pool}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" >/dev/null 2>&1; then
              gcloud beta run worker-pools delete "${worker_pool}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --quiet
            fi
          done
