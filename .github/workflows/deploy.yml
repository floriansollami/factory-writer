name: Deploy Cloud Run + Temporal Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write" # Obligatoire pour Workload Identity Federation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Supply Chain Security Scan
        run: |
          pip install uv
          cd backend && uv export > requirements.txt
          # Audit faille Zero-Day avant de déployer
          # (Décommenter après validation SOTA) 
          # uv run pip-audit -r requirements.txt || true

      # Étape 1 : Authentification SOTA (Sans Clé)
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@fc2174804b84f912b1f6d334e9463f484f1c552d # v3
        with:
          project_id: "factory-writer-poc-1776097019"
          workload_identity_provider: "projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com"

      # Étape 2 : Construction de l'image Docker
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          install_components: 'beta'

      - name: Build and Push Docker Image
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev
          # On s'assure que le repository Artifact Registry existe
          gcloud artifacts repositories create cloud-run-source-deploy --repository-format=docker --location=europe-west1 || true
          # Build de l'image
          docker build -t europe-west1-docker.pkg.dev/factory-writer-poc-1776097019/cloud-run-source-deploy/factory-writer:${{ github.sha }} ./backend
          docker push europe-west1-docker.pkg.dev/factory-writer-poc-1776097019/cloud-run-source-deploy/factory-writer:${{ github.sha }}

      # Étape 3 : Déploiement Cloud Run (API HTTP)
      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v2
        with:
          service: "factory-writer-api"
          region: "europe-west1"
          image: "europe-west1-docker.pkg.dev/factory-writer-poc-1776097019/cloud-run-source-deploy/factory-writer:${{ github.sha }}"
          flags: |
            --command=uvicorn
            --args=src.main:app,--host,0.0.0.0,--port,8080
            --allow-unauthenticated
            --add-cloudsql-instances="factory-writer-poc-1776097019:europe-west1:factory-writer-db"
          env_vars: |
            GCP__PROJECT_ID=factory-writer-poc-1776097019
            GCP__LOCATION=europe-west1
            TEMPORAL__ADDRESS=factory-writer-poc.waxwe.tmprl.cloud:7233
            TEMPORAL__NAMESPACE=factory-writer-poc.waxwe
          secrets: |
            TEMPORAL__API_KEY=temporal-api-key:latest
            DB__URL=db-url:latest

      # Étape 4 : Déploiement Cloud Run Worker Pool (Temporal)
      - name: Deploy Temporal Worker to Cloud Run Worker Pools
        run: |
          gcloud beta run worker-pools deploy factory-writer-worker --quiet \
            --image="europe-west1-docker.pkg.dev/factory-writer-poc-1776097019/cloud-run-source-deploy/factory-writer:${{ github.sha }}" \
            --region="europe-west1" \
            --project="factory-writer-poc-1776097019" \
            --command=python \
            --args=-m,src.temporal.worker \
            --add-cloudsql-instances="factory-writer-poc-1776097019:europe-west1:factory-writer-db" \
            --set-env-vars="GCP__PROJECT_ID=factory-writer-poc-1776097019,GCP__LOCATION=europe-west1,TEMPORAL__ADDRESS=factory-writer-poc.waxwe.tmprl.cloud:7233,TEMPORAL__NAMESPACE=factory-writer-poc.waxwe" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest"
