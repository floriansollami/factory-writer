name: Deploy Cloud Run API + Temporal Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-writer-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: factory-writer-poc-1776097019
  REGION: europe-west1
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: factory-writer
  CLOUDSQL_INSTANCE: factory-writer-poc-1776097019:europe-west1:factory-writer-db
  TEMPORAL_ADDRESS: factory-writer-poc.waxwe.tmprl.cloud:7233
  TEMPORAL_NAMESPACE: factory-writer-poc.waxwe
  TEMPORAL_DEPLOYMENT_NAME: factory-writer
  GCP_LOCATION: global
  GCP_DOCUMENT_AI_LOCATION: eu
  GCP_DOCUMENT_AI_PROCESSOR_ID: 684ca2ae2323b47c
  GCP_DOCUMENT_AI_PROCESSOR_VERSION: pretrained-layout-parser-v1.5-2025-08-25
  GCP_STYLE_GUIDE_BUCKET_NAME: factory-writer-poc-1776097019-brand-styles
  LLM_STYLE_GUIDE_TIMEOUT_SECONDS: "90"
  EVENTARC_STYLE_GUIDE_TRIGGER: factory-writer-style-guide-finalized
  EVENTARC_TRIGGER_SERVICE_ACCOUNT: eventarc-style-trigger@factory-writer-poc-1776097019.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: factory-writer-runtime@factory-writer-poc-1776097019.iam.gserviceaccount.com

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check src/factory_writer alembic tests

      - name: Type-check backend
        working-directory: backend
        run: uv run mypy --explicit-package-bases src/factory_writer alembic tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest

      - name: Compile backend sources
        working-directory: backend
        run: uv run python -m compileall src/factory_writer alembic

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Compute image metadata
        id: meta
        run: |
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if ! gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${ARTIFACT_REPOSITORY}" \
              --project="${PROJECT_ID}" \
              --repository-format=docker \
              --location="${REGION}"
          fi
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            ./backend
          docker push "${{ steps.meta.outputs.image }}"

  migrate-db:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy and execute DB migration job
        run: |
          gcloud run jobs deploy factory-writer-db-migrate \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --task-timeout=600s \
            --max-retries=1 \
            --tasks=1 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=alembic \
            --args=-c,alembic.ini,upgrade,head \
            --execute-now \
            --wait

      - name: Deploy and execute taxonomy seed job
        run: |
          gcloud run jobs deploy factory-writer-db-seed \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --task-timeout=300s \
            --max-retries=1 \
            --tasks=1 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=python \
            --args=-m,factory_writer.scripts.seed_taxonomie \
            --execute-now \
            --wait

  deploy-api:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-db]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy factory-writer-api \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --no-allow-unauthenticated \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=uvicorn \
            --args=factory_writer.main:app,--host,0.0.0.0,--port,8080

      - name: Grant Eventarc invoker access to API
        run: |
          gcloud run services add-iam-policy-binding factory-writer-api \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --member="serviceAccount:${EVENTARC_TRIGGER_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Ensure Eventarc trigger for style guide uploads
        run: |
          if gcloud eventarc triggers describe "${EVENTARC_STYLE_GUIDE_TRIGGER}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>&1; then
            echo "Eventarc trigger ${EVENTARC_STYLE_GUIDE_TRIGGER} already exists."
          else
            gcloud eventarc triggers create "${EVENTARC_STYLE_GUIDE_TRIGGER}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --destination-run-service=factory-writer-api \
              --destination-run-region="${REGION}" \
              --destination-run-path=/webhooks/eventarc/style-guide \
              --event-filters="type=google.cloud.storage.object.v1.finalized" \
              --event-filters="bucket=${GCP_STYLE_GUIDE_BUCKET_NAME}" \
              --service-account="${EVENTARC_TRIGGER_SERVICE_ACCOUNT}"
          fi

  deploy-workers:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-db]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: style-guide-ingestion
            worker_pool: factory-writer-style-guide-ingestion
            instances: 1
            enabled_poc: true
          - role: sku-lifecycle
            worker_pool: factory-writer-sku-lifecycle
            instances: 1
            enabled_poc: true
          - role: offline-evaluation
            worker_pool: factory-writer-offline-evaluation
            instances: 0
            enabled_poc: false

    steps:
      - name: Authenticate to Google Cloud (WIF)
        if: ${{ matrix.enabled_poc }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/623736074911/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@factory-writer-poc-1776097019.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        if: ${{ matrix.enabled_poc }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta

      - name: Deploy worker pool
        if: ${{ matrix.enabled_poc }}
        run: |
          gcloud beta run worker-pools deploy "${{ matrix.worker_pool }}" --quiet \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --instances="${{ matrix.instances }}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --set-env-vars="GCP__PROJECT_ID=${PROJECT_ID},GCP__LOCATION=${GCP_LOCATION},GCP__DOCUMENT_AI_LOCATION=${GCP_DOCUMENT_AI_LOCATION},GCP__DOCUMENT_AI_PROCESSOR_ID=${GCP_DOCUMENT_AI_PROCESSOR_ID},GCP__DOCUMENT_AI_PROCESSOR_VERSION=${GCP_DOCUMENT_AI_PROCESSOR_VERSION},GCP__STYLE_GUIDE_BUCKET_NAME=${GCP_STYLE_GUIDE_BUCKET_NAME},TEMPORAL__ADDRESS=${TEMPORAL_ADDRESS},TEMPORAL__NAMESPACE=${TEMPORAL_NAMESPACE},TEMPORAL__DEPLOYMENT_NAME=${TEMPORAL_DEPLOYMENT_NAME},TEMPORAL__WORKER_ROLE=${{ matrix.role }},LLM__STYLE_GUIDE_TIMEOUT_SECONDS=${LLM_STYLE_GUIDE_TIMEOUT_SECONDS}" \
            --set-secrets="TEMPORAL__API_KEY=temporal-api-key:latest,DB__URL=db-url:latest" \
            --command=python \
            --args=-m,factory_writer.temporal.worker
