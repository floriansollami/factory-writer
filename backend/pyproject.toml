[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "factory-writer"
version = "0.1.0"
description = "Moteur central Factory Writer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "psycopg[binary,pool]",
    "temporalio",
    "litellm",
    "google-cloud-documentai",
    "google-cloud-storage",
    "greenlet>=3.4.0",
    "structlog",
    "asgi-correlation-id",
    "google-cloud-documentai-toolbox>=0.15.2",
    "mstache>=0.3.0",
    "pymupdf>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx",
    "asgi-lifespan",
    "testcontainers[postgres]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"] # Imports triés (I), Pyflakes (F), pycodestyle (E), pyupgrade (UP), bugbear (B), flake8-simplify (SIM)
ignore = ["E501", "B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/factory_writer"]
artifacts = ["src/factory_writer/application/prompts/**/*.mustache"]

[tool.mypy]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
